output_dir: .

wandb:
  project: airfrans_sdf
  mode: disabled   # set to online if desired

dataset:
  root_path: ${oc.env:AIRFRANS_ROOT,/public/share/sugonhpcapp01/onestore/onedatasets/Transolver-Airfoil-Design/Dataset}
  task: scarce

# The paper specifies K=3 and an 8-D geometry code, but does not report the
# remaining SDF optimization settings. Those values retain the reproducible
# defaults used by the implementation.
optim:
  batch_size: 4
  epochs: 1000
  inner_steps: 3
  lr_inr: 5e-5
  lr_code: 0.01
  meta_lr_code: 5e-5
  num_points: 5000

inr:
  model_type: fourier_features
  target_field: implicit_distance
  input_dim: 2
  output_dim: 1
  latent_dim: 8
  depth: 5
  hidden_dim: 256
  activation: relu
  w0: null
  use_latent: true
  modulate_scale: false
  modulate_shift: true
  hypernet_depth: 1
  hypernet_width: 128
  frequency_embedding: gaussian
  # Paper Sec. 3.1.2: 64 Gaussian Fourier frequency vectors with sigma=1.
  # Eq. (3)-(5) feeds gamma(x), without concatenating the raw coordinates.
  include_input: false
  scale: 1.0
  num_frequencies: 64
  max_frequencies: 8
  base_frequency: 1.25
  last_activation: null
  loss_type: mse
  add_cond_in: false
  add_sdf_in: false
  global_norm: false
  is_input: true

restart_training: false
saved_model_path: null
