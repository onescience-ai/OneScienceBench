saved_model_path: null
restart_training: false

wandb:
  project: airfrans_flow
  mode: disabled   # set to online if desired

dataset:
  root_path: ${oc.env:AIRFRANS_ROOT,/public/share/sugonhpcapp01/onestore/onedatasets/Transolver-Airfoil-Design/Dataset}
  task: scarce
  geom_latent_dim: 8
  train_latents_path: null
  test_latents_path: null
  auto_find_latents: true

optim:
  # Paper Sec. 3.1.2: 1000 epochs, Adam lr=1e-3, and 16000 sampled
  # points per case and epoch. Batch size is not reported by the paper.
  batch_size: 4
  batch_size_val: 4
  lr_inr: 1e-3
  epochs: 1000
  num_points: 16000

inr:
  model_type: ms_fourier_features
  latent_dim: 10   # 8 geometry latent + 2 inlet velocity components
  in_dim: 6
  out_dim: 4
  out_scalar_dim: 0
  depth: 6
  hidden_dim: 256
  w0: null
  use_latent: true
  modulate_scale: false
  modulate_shift: true
  # Paper Sec. 3.1.2 explicitly uses a 3-layer output hypernetwork.
  hypernet_depth: 3
  hypernet_width: 256
  frequency_embedding: gaussian
  # Eq. (3)-(5) uses one Gaussian Fourier scale, sigma=1, and gamma(x)
  # without an additional raw-input concatenation.
  include_input: false
  scale: [1.0]
  num_frequencies: 64
  max_frequencies: 8
  base_frequency: 1.25
  last_activation: null
  loss_type: mse
  add_cond_in: false
  add_sdf_in: null
  global_norm: false
