data:
  directory: "/public/share/sugonhpcapp01/onestore/onedatasets/DeepCFD/data"
  input_file: "dataX.pkl"
  target_file: "dataY.pkl"
  split_ratio: 0.7
  seed: 0
  batch_size: 16
  num_workers: 0

model:
  in_channels: 3
  out_channels: 3
  base_channels: 8
  num_stages: 4
  kernel_size: 5
  bilinear: true
  normtype: "none"

training:
  output_dir: "./weight"
  checkpoint_name: "best_model.pt"
  num_epochs: 1000
  lr: 0.001
  weight_decay: 0.005
  patience: 200
  eval_interval: 10

inference:
  checkpoint_path: "/public/share/sugonhpcapp01/onestore/onedatasets/DeepCFD/weight/best_model.pt"
  result_dir: "./result/deepcfd"
  num_visualize: 4
