experiment:
  name: rno_darcy_paper_rep
  seed: 0
  paper_target_relative_l2: 0.00510

data:
  root: /public/share/sugonhpcapp01/onestore/onedatasets/CFD_Benchmark/darcy
  train_file: piececonst_r421_N1024_smooth1.mat
  test_file: piececonst_r421_N1024_smooth2.mat
  input_key: coeff
  target_key: sol
  train_samples: 1000
  test_samples: 200
  subsample: 5
  resolution: 85
  normalize_input: true
  normalize_target: true
  normalization_eps: 1.0e-6

model:
  in_channels: 3
  out_channels: 1
  channels: 128
  layers: 8
  heads: 8
  slices: 32
  angles: 32
  radon_blocks: 4
  angle_hidden: 16
  mlp_ratio: 4.0
  dropout: 0.0

training:
  epochs: 500
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 1.0e-5
  optimizer: adamw
  scheduler: one_cycle
  gradient_loss_weight: 0.1
  max_grad_norm: 1.0
  amp: false
  checkpoint_every: 10
  log_every: 10
  num_workers: 0

evaluation:
  batch_size: 4
  save_predictions: true
  max_saved_samples: 200

runtime:
  device: auto
  deterministic: true

output:
  root: .
  checkpoints: weight
  logs: results/logs
  results: results
