# MMPINN multi-frequency 2D standard implementation configuration.
# Paper: Wang et al., "A practical PINN framework for multi-scale problems
# with multi-magnitude loss terms" (arXiv:2308.06672), Section 4.5.

# ---- problem definition (paper Eq. 4.12-4.13) ----
lb: [-1.0, 0.0]            # [x_min, t_min]
ub: [1.0, 1.0]             # [x_max, t_max]
exact_solution: "sin(20*pi*t / (1 + 9*x^2))"

# ---- network architecture (MFF / multi-scale Fourier feature) ----
layers: [300, 300, 300, 300, 1]   # 4 hidden layers x 300 neurons
sigma: 10.0                        # Fourier feature std (paper: sigma=10)
activation: tanh

# ---- training data (paper Sec. 4.5) ----
N0: 1200                    # initial condition sampling points
N_b: 1200                   # boundary sampling points
N_f: 120000                 # residual (interior) sampling points
grid_n: 1200                # test grid resolution (1200 x 1200 = 1,440,000 pts)

# ---- multi-magnitude regularization (paper Sec. 3.2, m=n=3) ----
m: 3                        # supervised loss power root
n: 3                        # residual loss power root

# ---- training protocol (paper Sec. 4 general) ----
adam_epochs: 2000           # Adam iterations before L-BFGS
adam_lr: 0.001
lbfgs_max_iter: 100000      # L-BFGS max_iter per segment (early stop on L2<1e-3)
lbfgs_segments: [1/3, 1/2, 1]   # multi-level exponents
seed: 1236

# ---- evaluation ----
metric: relative_l2_error
baseline: 7.95e-4           # official MMPINN-MFF L2 (paper Table 4.7)
