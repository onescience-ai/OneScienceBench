experiment:
  name: rno_darcy_multiscale_physics
  seed: 0
  output_dir: ./results/rno_darcy_paper_rep_seed0/
  device: auto

data:
  root: /public/share/sugonhpcapp01/onestore/onedatasets/CFD_Benchmark/darcy
  train_file: piececonst_r421_N1024_smooth1.mat
  test_file: piececonst_r421_N1024_smooth2.mat
  input_key: coeff
  target_key: sol
  native_resolution: 421
  downsample: 5
  resolution: 85
  coarse_resolution: 43
  n_train: 1000
  n_test: 200
  num_workers: 0
  cache_enabled: true
  cache_dir: ./cache/rno_darcy_multiscale
  importance_alpha: 2.0
  importance_max: 8.0

model:
  name: MultiScaleRNO2D
  hidden_dim: 128
  num_heads: 8
  num_layers: 8
  num_angles: 32
  num_radon_blocks: 4
  fine_radon_blocks: 2
  coarse_radon_blocks: 2
  coarse_num_angles: 16
  cache_radon_grids: true
  angle_weighting: paper_conv
  angle_conv_channels: 16
  angle_conv_kernel_size: 3
  include_pi_endpoint: true
  slice_num: 64
  ref_grid_size: 8
  unified_pos: true
  dropout: 0.0
  mlp_ratio: 1
  input_dim: 1
  output_dim: 1

training:
  epochs: 500
  batch_size: 4
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.00001
  scheduler: one_cycle
  max_grad_norm: 0.1
  amp: false
  eval_every: 1
  checkpoint_every: 100

loss:
  data: relative_l2
  gradient: relative_l2
  gradient_weight: 0.1
  pde_weight_max: 0.01
  boundary_weight_max: 0.05
  curriculum_start_fraction: 0.05
  curriculum_end_fraction: 0.40
  forcing: 1.0
  coefficient_average: harmonic

paper_reference:
  metric: relative_l2
  darcy_main_result: 0.00510
  source: NeurIPS_2025_Table_1_and_Table_8

development:
  baseline: rno_darcy_train
  changes:
    - parallel_fine_coarse_radon_processor
    - cached_radon_sampling_grids
    - cached_multiresolution_data_pipeline
    - interface_importance_weighting
    - curriculum_darcy_residual_and_boundary_loss

