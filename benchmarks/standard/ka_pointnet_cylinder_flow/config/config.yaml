experiment:
  name: ka_pointnet_cylinder_main
  seed: 0
  checkpoint_path: weight/best_model.pth
  results_dir: results

data:
  root: /public/share/sugonhpcapp01/onestore/onedatasets/PointNetCFD_data/data
  cfd_file: CFDdata.npy
  training_idx_file: training_idx.npy
  validation_idx_file: validation_idx.npy
  test_idx_file: test_idx.npy
  num_points: 1024
  input_columns:
    x: 0
    y: 1
  output_columns:
    p: 2
    u: 3
    v: 4

model:
  input_channels: 2
  output_channels: 3
  network_scaling: 1.0
  poly_degree: 5
  alpha: 1.0
  beta: 1.0

training:
  max_epochs: 10
  train_batch_size: 64
  eval_batch_size: 64
  learning_rate: 0.0005
  betas: [0.9, 0.999]
  eps: 1.0e-8
  early_stopping_patience: 10
  num_workers: 0

inference:
  batch_size: 64
  split: test

visualization:
  sample_index: 0
  dpi: 150
